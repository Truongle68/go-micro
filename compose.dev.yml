services:
  identity-db:
    container_name: identity-db
    image: postgres:18-alpine
    volumes:
      - identity-data:/var/lib/postgresql
      - ./user-service/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./user-service/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    environment:
      - POSTGRES_USER=${IDENTITY_POSTGRES_USER}
      - POSTGRES_PASSWORD=${IDENTITY_POSTGRES_PW}
      - POSTGRES_DB=${IDENTITY_POSTGRES_DB}
    ports:
      - "5433:5432"
    restart: always
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:8-alpine
    # command forces redis to log changes to dist instantly (Append-Only File)
    command: redis-server --appendonly yes --requirepass ${REDIS_PW:-secretredispass}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PW:-secretredispass}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  catalog-db:
    image: mongodb/mongodb-community-server:8.0-ubi8-slim
    container_name: catalog-db
    hostname: catalog-db
    volumes:
      - ./catalog-service/scripts/mongo-init:/docker-entrypoint-initdb.d
      - catalog-data:/data/db
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=${CATALOG_MONGO_USER}
      - MONGODB_INITDB_ROOT_PASSWORD=${CATALOG_MONGO_PW}
      - MONGO_INITDB_DATABASE=${CATALOG_MONGO_DB}
    ports:
      - "27018:27017"
    restart: always
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - catalog-net

  order-db:
    container_name: order-db
    image: postgres:18-alpine
    volumes:
      - order-data:/var/lib/postgresql
      - ./order-service/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    environment:
      - POSTGRES_USER=${ORDER_POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${ORDER_POSTGRES_PW:-postgres}
      - POSTGRES_DB=${ORDER_POSTGRES_DB:-order-db}
    ports:
      - "5434:5432"
    restart: always
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  identity-data:
  catalog-data:
  redis-data:
  order-data:

networks:
  catalog-net:
