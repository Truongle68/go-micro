syntax = "proto3";

package user.v1;

option go_package = "github.com/TruongLe68/go-micro/pkg/gen/proto/go/user/v1;userv1";

service UserService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  string user_id = 1;
  string email = 2;
  string phone = 3;
  string full_name = 4;
  string status = 5;
  bool is_email_verified = 6;
}
